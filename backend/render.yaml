services:
  - type: web
    name: golu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: golu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: golu-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: worker
    name: golu-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: python -m app.workers.background_worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: golu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: golu-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: golu-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: golu-api
          envVarKey: JWT_SECRET_KEY

  - type: redis
    name: golu-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: golu-postgres
    plan: starter
    databaseName: golu_db
    user: golu_user
