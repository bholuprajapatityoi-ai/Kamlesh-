services:
  postgres:
    image: postgres:16-alpine
    container_name: golu_postgres
    environment:
      POSTGRES_USER: golu_user
      POSTGRES_PASSWORD: golu_dev_password_change_me
      POSTGRES_DB: golu_db
    ports:
      - "5432:5432"
    volumes:
      - golu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golu_user -d golu_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: golu_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - golu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: golu_fastapi
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://golu_user:golu_dev_password_change_me@postgres:5432/golu_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: golu_worker
    command: ["python", "-m", "app.workers.background_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://golu_user:golu_dev_password_change_me@postgres:5432/golu_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development

volumes:
  golu_pg_data:
  golu_redis_data:
